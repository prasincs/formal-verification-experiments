set timeout=0
set default=0
terminal_output console

menuentry "seL4 x86_64 bootprof" {
    # Keep VGA text mode: the BOOTPROF patch mirrors the kernel console to
    # the 80x25 text buffer that GRUB reports via multiboot2.
    set gfxpayload=text
    multiboot2 /boot/kernel.elf
    module2 /boot/rootserver.elf
}
