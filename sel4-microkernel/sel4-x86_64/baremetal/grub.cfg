set timeout=0
set default=0
terminal_output console

menuentry "seL4 x86_64 bootprof" {
    # The BOOTPROF patch draws the kernel console into the framebuffer that
    # GRUB reports via multiboot2: EGA text on BIOS, the GOP mode on UEFI.
    if [ "$grub_platform" = "efi" ]; then
        # "keep" only works if GRUB already set a video mode; "auto" makes
        # GRUB pick a GOP mode and report it in the multiboot2 tag.
        insmod efi_gop
        set gfxpayload=auto
    else
        set gfxpayload=text
    fi
    multiboot2 /boot/kernel.elf
    module2 /boot/rootserver.elf
}
